name: dev5-sync-version

on:
  push:
    branches:
      - v0.1.0-dev5

permissions:
  contents: write

jobs:
  sync:
    if: github.event.head_commit.message == 'chore: sync dev5 version metadata'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: v0.1.0-dev5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '20'
      - name: Sync dev5 version identity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          packageJson.version = '0.1.0-dev5';
          fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = '0.1.0-dev5';
          lock.packages[''].version = '0.1.0-dev5';
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          const replacements = [
            ['api/health.ts', '0.1.0-dev4', '0.1.0-dev5'],
            ['api/server.ts', 'version: "0.1.0-dev3"', 'version: "0.1.0-dev5"'],
            ['test/vercel-routes.test.ts', 'version: "0.1.0-dev4"', 'version: "0.1.0-dev5"'],
          ];
          for (const [path, before, after] of replacements) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`missing expected version marker in ${path}`);
            fs.writeFileSync(path, source.replace(before, after));
          }
          NODE
          git diff --check
          git diff -- package.json package-lock.json api/health.ts api/server.ts test/vercel-routes.test.ts
      - name: Commit version sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json api/health.ts api/server.ts test/vercel-routes.test.ts
          git commit -m 'chore: align dev5 version identity'
          git push origin HEAD:v0.1.0-dev5
