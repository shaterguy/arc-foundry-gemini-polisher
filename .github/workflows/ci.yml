name: ci

on:
  push:
    branches:
      - v0.1.0-dev1
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify framework-free runtime install
        run: |
          for package in next react react-dom; do
            if [ -d "node_modules/$package" ]; then
              echo "Unexpected framework package installed: $package"
              exit 1
            fi
          done
      - name: Audit locked dependency tree
        run: npm audit --audit-level=high
      - name: Typecheck Vercel Functions
        run: npm run typecheck
      - name: Unit and route tests
        run: npm test
