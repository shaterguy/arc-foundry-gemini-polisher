name: dev3-type-fix

on:
  push:
    branches:
      - v0.1.0-dev3

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout dev3
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.1.0-dev3
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Apply narrow type fixes
        shell: python
        run: |
          from pathlib import Path

          server = Path("api/server.ts")
          text = server.read_text()
          old = '      securitySchemes: [{ type: "oauth2", scopes: [OAUTH_SCOPE] }],'
          new = '      _meta: { securitySchemes: [{ type: "oauth2", scopes: [OAUTH_SCOPE] }] },'
          assert text.count(old) == 1
          server.write_text(text.replace(old, new))

          oauth = Path("lib/oauth.ts")
          text = oauth.read_text()
          marker = 'export async function rotateRefreshToken('
          alias = 'type RefreshOutcome =\n  | { kind: "invalid" }\n  | { kind: "replay" }\n  | { kind: "scope" }\n  | { kind: "ok"; scopes: string[] };\n\nexport async function rotateRefreshToken('
          assert text.count(marker) == 1
          text = text.replace(marker, alias)
          old_tx = '  const outcome = await store.transact((state) => {'
          new_tx = '  const outcome = await store.transact<RefreshOutcome>((state) => {'
          assert text.count(old_tx) == 1
          oauth.write_text(text.replace(old_tx, new_tx))
      - name: Install locked dependencies
        run: npm ci --omit=peer --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Native ESM runtime check
        run: npm run runtime-check
      - name: Tests
        run: npm test
      - name: Commit fixes and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/server.ts lib/oauth.ts
          git rm .github/workflows/dev3-type-fix.yml
          git commit -m "fix: align OAuth metadata with MCP SDK v2"
          git push origin HEAD:v0.1.0-dev3
