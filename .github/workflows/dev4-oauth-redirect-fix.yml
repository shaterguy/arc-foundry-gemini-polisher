name: dev4-oauth-redirect-fix

on:
  push:
    branches:
      - v0.1.0-dev4

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout dev4
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: v0.1.0-dev4
          fetch-depth: 0
      - name: Apply minimal OAuth browser redirect fix
        shell: python
        run: |
          from pathlib import Path
          import json

          oauth = Path('lib/oauth.ts')
          text = oauth.read_text()
          old = "content-security-policy\": \"default-src 'none'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'\""
          new = "content-security-policy\": \"default-src 'none'; form-action 'self' https://chatgpt.com; frame-ancestors 'none'; base-uri 'none'\""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one CSP target, found {text.count(old)}')
          oauth.write_text(text.replace(old, new))

          authorize = Path('api/oauth-authorize.ts')
          text = authorize.read_text()
          old_import = "  OAUTH_CSRF_COOKIE,\n  OWNER_ATTEMPT_LIMIT,"
          new_import = "  OAUTH_CSRF_COOKIE,\n  OAuthProtocolError,\n  OWNER_ATTEMPT_LIMIT,"
          if text.count(old_import) != 1:
              raise SystemExit('OAuthProtocolError import insertion target mismatch')
          text = text.replace(old_import, new_import)
          old_csrf = '      return oauthErrorResponse(new Error("csrf"));'
          new_csrf = '      return oauthErrorResponse(new OAuthProtocolError("invalid_request"));'
          if text.count(old_csrf) != 1:
              raise SystemExit('CSRF error mapping target mismatch')
          authorize.write_text(text.replace(old_csrf, new_csrf))

          Path('test/oauth-browser-redirect.test.ts').write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport {\n  OAUTH_RESOURCE,\n  OAUTH_SCOPE,\n  OAuthProtocolError,\n  oauthErrorResponse,\n  renderAuthorizationPage,\n} from "../lib/oauth";\n\nconst authorization = {\n  clientId: "https://chatgpt.com/oauth/arc-foundry/client.json",\n  redirectUri: "https://chatgpt.com/connector/oauth/callback-test",\n  resource: OAUTH_RESOURCE,\n  scopes: [OAUTH_SCOPE, "offline_access"],\n  state: "state-browser-redirect-1234",\n  codeChallenge: "a".repeat(43),\n};\n\ntest("authorization page permits only self and ChatGPT for form redirect navigation", () => {\n  const response = renderAuthorizationPage(authorization, "csrf-test");\n  assert.equal(response.status, 200);\n  assert.equal(\n    response.headers.get("content-security-policy"),\n    "default-src 'none'; form-action 'self' https://chatgpt.com; frame-ancestors 'none'; base-uri 'none'",\n  );\n  assert.match(response.headers.get("set-cookie") ?? "", /__Host-af_oauth_csrf=/u);\n});\n\ntest("CSRF protocol failures are represented as invalid_request rather than storage outage", async () => {\n  const response = oauthErrorResponse(new OAuthProtocolError("invalid_request"));\n  assert.equal(response.status, 400);\n  assert.deepEqual(await response.json(), { error: "invalid_request" });\n});\n''')

          package = Path('package.json')
          data = json.loads(package.read_text())
          if data.get('version') != '0.1.0-dev3':
              raise SystemExit(f'unexpected package version: {data.get("version")}')
          data['version'] = '0.1.0-dev4'
          package.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          lock = Path('package-lock.json')
          data = json.loads(lock.read_text())
          if data.get('version') != '0.1.0-dev3' or data.get('packages', {}).get('', {}).get('version') != '0.1.0-dev3':
              raise SystemExit('unexpected package-lock version')
          data['version'] = '0.1.0-dev4'
          data['packages']['']['version'] = '0.1.0-dev4'
          lock.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n')

          health = Path('api/health.ts')
          text = health.read_text()
          if text.count('version: "0.1.0-dev3"') != 1:
              raise SystemExit('health version target mismatch')
          health.write_text(text.replace('version: "0.1.0-dev3"', 'version: "0.1.0-dev4"'))
      - name: Commit exact dev4 candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/oauth.ts api/oauth-authorize.ts test/oauth-browser-redirect.test.ts package.json package-lock.json api/health.ts
          git diff --cached --check
          git commit -m "fix: allow ChatGPT OAuth callback navigation"
          git push origin HEAD:v0.1.0-dev4
